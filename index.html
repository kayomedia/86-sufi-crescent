<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Property Virtual Tour — Mini Viewer</title>
  <style>
    :root { --slide-duration: 4s; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      height: -webkit-fill-available;
      overscroll-behavior: none;
      touch-action: none;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── LOADING SCREEN ── */
    #loader {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.6s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #loader-text {
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      color: #aaa;
      margin-bottom: 20px;
    }
    #progress-bar-wrap {
      width: 200px;
      height: 2px;
      background: #333;
      border-radius: 2px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: #fff;
      transition: width 0.2s ease;
    }

    /* ── SLIDESHOW ── */
    #slideshow {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000;
      touch-action: pan-y;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .slide.active { opacity: 1; }
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      transform: scale(1);
      transition: transform var(--slide-duration) ease-out;
    }
    .slide.active img { transform: scale(1.05); }
    .slide:not(.active) img { transform: scale(1); transition: transform 0s 1s; }

    /* ── CONTROLS ── */
    #controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 18px 24px;
      padding-bottom: calc(18px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #slideshow:hover #controls, #controls:hover { opacity: 1; }

    /* Always visible on touch devices */
    @media (hover: none) {
      #controls, #dots, #fullscreen-btn, #title { opacity: 1 !important; }
    }

    .ctrl-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .ctrl-btn:hover  { background: rgba(255,255,255,0.25); }
    .ctrl-btn:active { background: rgba(255,255,255,0.35); }

    #play-pause { width: 56px; height: 56px; font-size: 1.3rem; }

    #counter {
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.6);
      min-width: 60px;
      text-align: center;
    }

    /* ── PROGRESS DOTS ── */
    #dots {
      position: fixed;
      bottom: calc(80px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90vw;
    }
    #slideshow:hover #dots { opacity: 1; }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .dot.active { background: #fff; transform: scale(1.4); }

    /* ── FULLSCREEN BTN ── */
    #fullscreen-btn {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top));
      right: calc(16px + env(safe-area-inset-right));
      z-index: 20;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #slideshow:hover #fullscreen-btn, #fullscreen-btn:hover { opacity: 1; }
    #fullscreen-btn:hover { background: rgba(255,255,255,0.15); }

    /* ── TITLE ── */
    #title {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top));
      left: calc(20px + env(safe-area-inset-left));
      z-index: 20;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #slideshow:hover #title { opacity: 1; }

    /* ── MOBILE ── */
    @media (max-width: 480px) {
      .ctrl-btn { width: 44px; height: 44px; font-size: 1rem; }
      #play-pause { width: 52px; height: 52px; }
      #controls { gap: 16px; padding: 14px 16px; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
      #title { font-size: 0.65rem; }
      .dot { width: 5px; height: 5px; }
    }
  </style>
</head>
<body>

  <!-- LOADER -->
  <div id="loader">
    <div id="loader-text">Loading images...</div>
    <div id="progress-bar-wrap">
      <div id="progress-bar"></div>
    </div>
  </div>

  <!-- SLIDESHOW -->
  <div id="slideshow">
    <div id="title"></div>
    <button id="fullscreen-btn" title="Fullscreen">⤢</button>
    <div id="dots"></div>
    <div id="controls">
      <button class="ctrl-btn" id="prev-btn">&#8592;</button>
      <button class="ctrl-btn" id="play-pause">&#10074;&#10074;</button>
      <button class="ctrl-btn" id="next-btn">&#8594;</button>
      <span id="counter">1 / 59</span>
    </div>
  </div>

  <script>
    const TOTAL = 65;
    const AUTO_INTERVAL = 4000; // ms between slides
    const FADE_DURATION = 1000; // must match CSS transition

    const slideshow = document.getElementById('slideshow');
    const dotsWrap  = document.getElementById('dots');
    const counter   = document.getElementById('counter');
    const playBtn   = document.getElementById('play-pause');
    const loader    = document.getElementById('loader');
    const bar       = document.getElementById('progress-bar');

    let current  = 0;
    let isPlaying = true;
    let timer    = null;
    let transitioning = false;

    // ── BUILD SLIDES ──
    const slides = [];
    const dots   = [];

    for (let i = 1; i <= TOTAL; i++) {
      const num  = String(i).padStart(2, '0');
      const div  = document.createElement('div');
      div.className = 'slide';

      const img  = document.createElement('img');
      img.src    = `image/${num}.jpg`;
      img.alt    = `Photo ${num}`;
      img.draggable = false;
      div.appendChild(img);
      slideshow.appendChild(div);
      slides.push(div);

      // dot
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.addEventListener('click', () => goTo(i - 1));
      dotsWrap.appendChild(dot);
      dots.push(dot);
    }

    // ── PRELOAD & PROGRESS ──
    let loaded = 0;
    slides.forEach((slide, idx) => {
      const img = slide.querySelector('img');
      const onLoad = () => {
        loaded++;
        bar.style.width = `${(loaded / TOTAL) * 100}%`;
        if (loaded === TOTAL) startShow();
      };
      img.addEventListener('load', onLoad);
      img.addEventListener('error', onLoad); // don't hang on missing images
      if (img.complete) onLoad();
    });

    function startShow() {
      loader.classList.add('hidden');
      setTimeout(() => loader.style.display = 'none', 700);
      activate(0);
      scheduleNext();
    }

    // ── NAVIGATION ──
    function activate(idx) {
      slides[current].classList.remove('active');
      dots[current].classList.remove('active');
      current = (idx + TOTAL) % TOTAL;
      slides[current].classList.add('active');
      dots[current].classList.add('active');
      counter.textContent = `${current + 1} / ${TOTAL}`;
    }

    function goTo(idx) {
      if (transitioning) return;
      transitioning = true;
      activate(idx);
      clearTimeout(timer);
      if (isPlaying) scheduleNext();
      setTimeout(() => transitioning = false, FADE_DURATION);
    }

    function scheduleNext() {
      clearTimeout(timer);
      timer = setTimeout(() => {
        goTo(current + 1);
      }, AUTO_INTERVAL);
    }

    // ── CONTROLS ──
    document.getElementById('prev-btn').addEventListener('click', () => goTo(current - 1));
    document.getElementById('next-btn').addEventListener('click', () => goTo(current + 1));

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.innerHTML = isPlaying ? '&#10074;&#10074;' : '&#9654;';
      if (isPlaying) scheduleNext();
      else clearTimeout(timer);
    });

    // ── FULLSCREEN ──
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    // ── KEYBOARD ──
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  goTo(current - 1);
      if (e.key === 'ArrowRight') goTo(current + 1);
      if (e.key === ' ') { e.preventDefault(); playBtn.click(); }
      if (e.key === 'f' || e.key === 'F') document.getElementById('fullscreen-btn').click();
    });

    // ── TOUCH SWIPE ──
    let touchStartX = 0;
    slideshow.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    slideshow.addEventListener('touchend', e => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 50) goTo(current + (diff > 0 ? 1 : -1));
    });
  </script>
</body>
</html>
